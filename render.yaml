services:
  - type: web
    name: minhareceita-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm run start:backend
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: minha_receita
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SERVE_STATIC
        value: "false"
